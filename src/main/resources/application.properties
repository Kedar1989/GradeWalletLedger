spring.application.name=GradeWalletLedger
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/gradewallet}
spring.datasource.username=${DATABASE_USERNAME:gradewallet}
spring.datasource.password=${DATABASE_PASSWORD:gradewallet}
spring.datasource.hikari.maximum-pool-size=${DATABASE_POOL_SIZE:20}
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
app.statement-llm.enabled=${STATEMENT_LLM_ENABLED:false}
app.statement-llm.api-key=${STATEMENT_LLM_API_KEY:}
app.statement-llm.model=${STATEMENT_LLM_MODEL:gpt-4o-mini}
app.statement-llm.endpoint=${STATEMENT_LLM_ENDPOINT:https://api.openai.com/v1/chat/completions}
app.admin.token=${ADMIN_API_TOKEN:dev-admin-token}
app.admin.user-id=${ADMIN_USER_ID:1}
app.reconciliation.cron=${RECONCILIATION_CRON:0 0 2 * * *}
app.idempotency.encryption-key=${IDEMPOTENCY_ENCRYPTION_KEY:dev-only-change-this-key}
